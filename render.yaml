services:
  - type: web
    name: reporttoday-backend
    env: node
    region: sao-paulo
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3005
